<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="英文法の解説と、英短文の種類分け（文型・文の種類・時制）を練習できるツール">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>英文法ツール</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">英文法ツール</h1>
    <p class="app-sub" id="header-sub">英文法の解説</p>
  </header>

  <main class="app-main">
    <!-- 解説 -->
    <section class="panel" id="panel-grammar" data-panel="grammar">
      <div class="grammar-layout" id="grammar-layout">
        <div class="grammar-list-wrap">
          <label class="search">
            <span class="visually-hidden">文法項目を検索</span>
            <input type="search" id="grammar-search" placeholder="項目を検索（例：比較、現在完了）" autocomplete="off">
          </label>
          <div id="grammar-list" class="grammar-list"></div>
        </div>
        <article id="grammar-detail" class="grammar-detail" aria-live="polite"></article>
      </div>
    </section>

    <!-- 種類分け一覧 -->
    <section class="panel" id="panel-list" data-panel="list" hidden>
      <div class="segmented" role="tablist" aria-label="分類の軸" id="list-axis"></div>
      <div class="chips" id="list-filters" aria-label="分類で絞り込み"></div>
      <label class="search">
        <span class="visually-hidden">英文を検索</span>
        <input type="search" id="list-search" placeholder="英文・日本語訳で検索" autocomplete="off">
      </label>
      <p class="list-count" id="list-count"></p>
      <ul class="sentence-list" id="sentence-list"></ul>
    </section>

    <!-- 練習 -->
    <section class="panel" id="panel-practice" data-panel="practice" hidden>
      <div class="segmented" role="tablist" aria-label="練習する分類の軸" id="practice-axis"></div>
      <div class="practice-stats" id="practice-stats"></div>
      <div class="practice-mode">
        <label class="toggle">
          <input type="checkbox" id="practice-wrong-only">
          <span>間違えた文だけ出す</span>
        </label>
        <button type="button" class="btn-text" id="practice-reset">成績をリセット</button>
      </div>
      <div class="card question-card" id="question-card"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="メニュー">
    <button type="button" class="tab" data-tab="grammar" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
      <span>解説</span>
    </button>
    <button type="button" class="tab" data-tab="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h10"/></svg>
      <span>種類分け一覧</span>
    </button>
    <button type="button" class="tab" data-tab="practice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      <span>練習</span>
    </button>
  </nav>

  <script src="grammar.js?v=2" defer></script>
  <script src="sentences.js?v=2" defer></script>
  <script src="app.js?v=2" defer></script>
</body>
</html>
